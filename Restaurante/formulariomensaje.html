<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Permite utilizar tildes, ñ y caracteres especiales -->
    <meta charset="UTF-8">

    <!-- Indica el autor de la página -->
    <meta name="author" content="Marcos">

    <!-- Palabras clave relacionadas con la página -->
    <meta name="keywords" content="Contacto, Mensaje, Formulario">

    <!-- Describe el contenido de la página -->
    <meta name="description" content="Formulario de contacto para enviar mensajes">

    <!-- Título que aparece en la pestaña del navegador -->
    <title>Formulario de Contacto</title>

    <link rel="icon" href="img/favicon.jpg" type="image/x-icon">
</head>

<body>

    <!-- Cabecera con el título del formulario -->
    <header>
        <h1>Envíenos su mensaje</h1>
    </header>

    <!-- Contenido principal de la página -->
    <main>

        <!-- Formulario para enviar un mensaje -->
        <form action="#" method="post">

            <!-- Campo para introducir el nombre -->
            <input type="text" name="nombre" placeholder="Su nombre" size="20" required>

            <!-- Campo para introducir el correo electrónico -->
            <input type="email" name="correo" placeholder="Su correo electrónico" size="25" required>

            <!-- Campo para introducir el teléfono -->
            <input type="tel" name="telefono" placeholder="Su teléfono" size="25" required>

            <br>
            <br>
            <br>

            <!-- Campo para escribir el asunto del mensaje -->
            <input type="text" name="asunto" placeholder="Asunto" size="80" required>

            <br>
            <br>
            <br>

            <!-- Cuadro para escribir el mensaje -->
            <textarea name="mensaje" rows="12" cols="80" maxlength="500" placeholder="Su mensaje" required></textarea>

            <br>

            <!-- Indica el límite máximo de caracteres -->
            <small>Máximo 500 caracteres</small>

            <br>
            <br>
            <br>

            <!-- Botón para enviar el formulario -->
            <button type="submit">ENVIAR</button>

        </form>

    </main>

    <!-- Zona de navegación -->
    <nav>
        <a href="./Restaurante.html">Volver al restaurante</a>
    </nav>

    <!-- Pie de página -->
    <footer>
        mmoralesvico55gmail.com
    </footer>

</body>
</html>
